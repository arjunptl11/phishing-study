<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Phishing Warning Study</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #f5f5f0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem;
  }
  .card {
    background: white;
    border: 1px solid #d0d0c8;
    border-radius: 12px;
    padding: 2.5rem;
    max-width: 480px;
    width: 100%;
    text-align: center;
  }
  h1 { font-size: 20px; color: #111; margin-bottom: 12px; }
  p { font-size: 14px; color: #555; line-height: 1.6; margin-bottom: 24px; }
  .spinner {
    width: 40px; height: 40px;
    border: 3px solid #e0e0d8;
    border-top-color: #1B4332;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto 20px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .note { font-size: 12px; color: #aaa; margin-top: 16px; }
</style>
</head>
<body>
<div class="card">
  <div class="spinner"></div>
  <h1>Preparing your study session</h1>
  <p>You are being assigned to a version of the interface design study. This will only take a moment.</p>
  <div class="note">Phishing Warning Study &nbsp;·&nbsp; Arjun Patel, NCSSM &nbsp;·&nbsp; Mentor: Dr. Cori Faklaris, UNC Charlotte</div>
</div>

<script>
// ── Replace these four URLs with your actual Formbricks survey links ──────────
var SURVEYS = [
  "https://app.formbricks.com/s/YOUR_CONDITION_A_LINK",
  "https://app.formbricks.com/s/YOUR_CONDITION_B_LINK",
  "https://app.formbricks.com/s/YOUR_CONDITION_C_LINK",
  "https://app.formbricks.com/s/YOUR_CONDITION_D_LINK"
];
// ─────────────────────────────────────────────────────────────────────────────

// Balanced allocation using localStorage so counts persist across visits
// Each browser that lands on this page gets a condition and the count increments
function getAssignment() {
  var counts = [0, 0, 0, 0];
  try {
    var stored = localStorage.getItem("survey_counts");
    if (stored) counts = JSON.parse(stored);
  } catch(e) {}

  // Find the minimum count
  var min = Math.min.apply(null, counts);

  // Collect all conditions tied at the minimum
  var eligible = [];
  for (var i = 0; i < counts.length; i++) {
    if (counts[i] === min) eligible.push(i);
  }

  // Pick randomly from eligible
  var chosen = eligible[Math.floor(Math.random() * eligible.length)];

  // Increment and save
  counts[chosen]++;
  try {
    localStorage.setItem("survey_counts", JSON.stringify(counts));
  } catch(e) {}

  return chosen;
}

// Short delay so the page renders before redirecting
setTimeout(function() {
  var idx = getAssignment();
  window.location.href = SURVEYS[idx];
}, 1200);
</script>
</body>
</html>
